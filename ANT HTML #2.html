<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ANT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* =======================================================================
     ANT DESIGN TOKENS
     Centralized color / type / spacing / radius system. Components below
     reference these variables rather than hard-coded values.
     ========================================================================= */
  :root{
    /* --- brand --- */
    --ant-blue:#2563eb;
    --ant-blue-dark:#1d4ed8;
    --ant-blue-tint:#eff6ff;

    /* --- neutrals --- */
    --ink:#171717;          /* charcoal — primary text */
    --ink-soft:#374151;     /* slightly lighter charcoal — sub-headings */
    --steel:#6b7280;        /* secondary text */
    --mist:#9ca3af;         /* tertiary / icon-only gray */
    --line:#e5e7eb;         /* borders & dividers */
    --line-soft:#eef0f2;
    --paper:#fafaf8;        /* warm white — app background */
    --panel:#ffffff;        /* white — cards & elevated surfaces */
    --sunken:#f3f4f6;       /* thumbnails, search bar, subtle fills */

    /* --- functional colors (always paired with a text label, never color alone) --- */
    --emergency:#dc2626; --emergency-bg:#fef2f2;
    --high:#ea580c;       --high-bg:#fff7ed;
    --normal:#374151;     --normal-bg:#f3f4f6;
    --low:#6b7280;        --low-bg:#f9fafb;
    --good:#16a34a;       --good-bg:#f0fdf4;
    --warning:#d97706;    --warning-bg:#fffbeb;

    /* --- radius --- */
    --radius-s:8px;
    --radius-m:12px;
    --radius-card:16px;
    --radius-l:20px;
    --radius-btn:14px;

    /* --- spacing scale (4 / 8 / 12 / 16 / 20 / 24 / 32 / 40 / 48) --- */
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px; --space-9:48px;

    /* --- type --- */
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--sunken);}
  body{
    font-family:var(--font);
    color:var(--ink);
    font-size:16px;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #root{width:100%;max-width:460px;min-height:100vh;background:var(--paper);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.06);}
  button{font-family:var(--font);cursor:pointer;}
  input,textarea,select{font-family:var(--font);}
  ::selection{background:var(--ant-blue);color:#fff;}
  :focus-visible{outline:2px solid var(--ant-blue);outline-offset:2px;}

  /* ---------- generic layout ---------- */
  .app-header{
    position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:var(--space-4) var(--space-5);
    display:flex;align-items:center;gap:var(--space-3);
    min-height:64px;
  }
  .app-header .brand-tag{font-size:12px;font-weight:800;color:var(--ant-blue);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:2px;}
  .app-header .htitle{font-size:22px;font-weight:700;letter-spacing:-0.01em;line-height:1.2;flex:1;}
  .app-header .hsub{font-size:13.5px;color:var(--steel);font-weight:500;margin-top:2px;display:flex;align-items:center;gap:4px;}
  .icon-btn{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);display:flex;align-items:center;justify-content:center;
    color:var(--ink);flex-shrink:0;
  }
  .icon-btn svg{width:20px;height:20px;}
  .icon-btn:active{background:var(--sunken);}
  .content{flex:1;overflow-y:auto;padding-bottom:100px;-webkit-overflow-scrolling:touch;}
  .content.no-nav{padding-bottom:28px;}
  .section-pad{padding:var(--space-5) var(--space-5) var(--space-1);}
  .h1{font-size:28px;font-weight:700;letter-spacing:-0.015em;line-height:1.2;margin:0 0 4px;color:var(--ink);}
  .h2{font-size:21px;font-weight:700;letter-spacing:-0.008em;line-height:1.25;margin:0;color:var(--ink);}
  .muted{color:var(--steel);}
  .tiny{font-size:12.5px;}
  .small{font-size:14px;}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:460px;background:var(--panel);
    border-top:1px solid var(--line);display:flex;z-index:30;
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .navitem{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:12px 4px 10px;background:none;border:none;color:var(--steel);
    min-height:60px;justify-content:center;
  }
  .navitem svg{width:23px;height:23px;}
  .navitem span{font-size:11.5px;font-weight:600;letter-spacing:0.01em;}
  .navitem.active{color:var(--ant-blue);}

  /* ---------- role select / login ---------- */
  .brand-mark{
    width:60px;height:60px;border-radius:16px;background:var(--ant-blue);
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-weight:800;font-size:22px;letter-spacing:0.01em;
  }
  .role-card{
    display:flex;align-items:center;gap:var(--space-4);padding:var(--space-5);
    border:1px solid var(--line);border-radius:var(--radius-card);
    background:var(--panel);margin-bottom:var(--space-3);width:100%;text-align:left;
    min-height:54px;
  }
  .role-card:active{background:var(--sunken);}
  .role-card .ricon{
    width:46px;height:46px;border-radius:12px;background:var(--sunken);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .role-card .ricon svg{width:22px;height:22px;color:var(--ink-soft);}
  .role-card .rtitle{font-size:17px;font-weight:600;margin:0 0 2px;color:var(--ink);}
  .role-card .rsub{font-size:14px;color:var(--steel);}

  .profile-pick{
    display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4);
    border:1px solid var(--line);border-radius:var(--radius-m);
    background:var(--panel);margin-bottom:var(--space-3);width:100%;text-align:left;
    min-height:54px;
  }
  .profile-pick:active{background:var(--sunken);}
  .avatar{
    width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;
  }
  .profile-pick .pname{font-size:16px;font-weight:600;color:var(--ink);}
  .profile-pick .pmeta{font-size:13.5px;color:var(--steel);margin-top:1px;}
  .profile-pick .chev{margin-left:auto;color:var(--mist);flex-shrink:0;}
  .profile-pick .chev svg{width:18px;height:18px;}

  .pinpad-wrap{display:flex;flex-direction:column;align-items:center;padding:var(--space-7) var(--space-6);}
  .pindots{display:flex;gap:16px;margin:var(--space-6) 0 var(--space-7);}
  .pindot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink);}
  .pindot.filled{background:var(--ant-blue);border-color:var(--ant-blue);}
  .pindot.err{border-color:var(--emergency);background:var(--emergency);}
  .padgrid{display:grid;grid-template-columns:repeat(3,72px);gap:16px;}
  .padkey{
    width:72px;height:72px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);font-size:23px;font-weight:600;color:var(--ink);
  }
  .padkey:active{background:var(--sunken);}
  .padkey.ghost{border:none;background:none;}
  .pin-error{color:var(--emergency);font-size:14px;font-weight:600;height:18px;margin-top:2px;}

  /* ---------- forms ---------- */
  .field{margin-bottom:var(--space-4);}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.01em;}
  .field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=number],
  .field input[type=date],.field input[type=time],.field textarea,.field select{
    width:100%;min-height:50px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--radius-m);
    background:var(--panel);font-size:16px;color:var(--ink);
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ant-blue);box-shadow:0 0 0 3px var(--ant-blue-tint);}
  .field textarea{resize:none;min-height:80px;}
  .checkline{display:flex;align-items:center;gap:10px;padding:12px 2px;min-height:44px;}
  .checkline input{width:20px;height:20px;accent-color:var(--ant-blue);}

  /* ---------- buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:52px;padding:14px 18px;border-radius:var(--radius-btn);border:none;
    font-size:16px;font-weight:600;letter-spacing:-0.005em;width:100%;
    transition:background .15s ease, opacity .15s ease;
  }
  .btn-primary{background:var(--ant-blue);color:#fff;}
  .btn-primary:active{background:var(--ant-blue-dark);}
  .btn-primary:disabled{background:var(--line);color:var(--mist);}
  .btn-secondary{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);}
  .btn-secondary:active{background:var(--sunken);}
  .btn-danger{background:var(--panel);color:var(--emergency);border:1.5px solid var(--line);}
  .btn-ghost{background:none;border:none;color:var(--ant-blue);font-weight:600;font-size:14.5px;padding:8px;width:auto;min-height:auto;}
  .btn-sm{min-height:44px;padding:10px 16px;font-size:14px;width:auto;border-radius:var(--radius-s);}

  /* ---------- search ---------- */
  .searchbar{
    display:flex;align-items:center;gap:10px;background:var(--sunken);
    border:1.5px solid transparent;border-radius:var(--radius-m);padding:14px 16px;min-height:52px;
    transition:border-color .15s ease, background .15s ease;
  }
  .searchbar:focus-within{border-color:var(--ant-blue);background:var(--panel);}
  .searchbar svg{width:19px;height:19px;color:var(--steel);flex-shrink:0;}
  .searchbar input{border:none;background:none;font-size:16px;flex:1;color:var(--ink);min-width:0;}
  .searchbar input:focus{outline:none;}
  .searchbar input::placeholder{color:var(--mist);}

  /* ---------- rails ---------- */
  .rail{margin-top:var(--space-6);}
  .rail-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--space-5) 12px;}
  .rail-scroll{display:flex;gap:var(--space-3);overflow-x:auto;padding:0 var(--space-5) 6px;scroll-snap-type:x proximity;}
  .rail-scroll::-webkit-scrollbar{display:none;}
  .prodcard{
    scroll-snap-align:start;flex-shrink:0;width:172px;border:1px solid var(--line);
    border-radius:var(--radius-m);background:var(--panel);overflow:hidden;text-align:left;
  }
  .prodcard:active{background:var(--sunken);}
  .thumb{
    width:100%;height:112px;background:var(--sunken);display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--line);
  }
  .thumb span{font-size:16px;font-weight:800;color:var(--mist);letter-spacing:0.02em;}
  .thumb svg{width:32px;height:32px;color:var(--mist);}
  .ricon svg{width:20px;height:20px;color:var(--ink-soft);}
  .prodcard .pbody{padding:12px 12px 14px;}
  .prodcard .pname{font-size:17px;font-weight:600;line-height:1.3;margin:0 0 4px;color:var(--ink);}
  .prodcard .pspec{font-size:16px;font-weight:800;color:var(--ink-soft);line-height:1.25;margin:0 0 3px;}
  .prodcard .punit{font-size:12.5px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:0.04em;}
  .prodcard .pdesc{font-size:13px;color:var(--steel);line-height:1.35;}

  /* ---------- compact current-project row (Foreman Home) ---------- */
  .compact-project-row{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--panel);overflow:hidden;min-height:74px;}
  .cpr-main{flex:1;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;min-width:0;}
  .cpr-main:active{background:var(--sunken);}
  .cpr-icon{width:40px;height:40px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ant-blue);}
  .cpr-icon svg{width:20px;height:20px;}
  .cpr-text{min-width:0;}
  .cpr-name{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cpr-label{font-size:13px;color:var(--steel);margin-top:1px;}
  .cpr-change{flex-shrink:0;display:flex;align-items:center;gap:2px;padding:0 16px;border:none;border-left:1px solid var(--line);background:none;color:var(--ant-blue);font-weight:700;font-size:15px;min-width:48px;}
  .cpr-change:active{background:var(--sunken);}
  .cpr-change svg{width:16px;height:16px;}

  /* ---------- quick-add product card (Recently Used / Most Used) ---------- */
  .prodcard-add{display:flex;flex-direction:column;padding:0;}
  .prodcard-add > button:first-child{border:none;background:none;text-align:left;padding:0;display:block;width:100%;}
  .quick-add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:none;border-top:1px solid var(--line);background:var(--sunken);color:var(--ant-blue);font-weight:700;font-size:14px;padding:10px 0;min-height:44px;}
  .quick-add-btn:active{background:var(--line);}
  .quick-add-btn svg{width:15px;height:15px;}
  .cat-row{display:flex;align-items:center;gap:10px;width:100%;padding:16px 4px;border:none;background:none;border-bottom:1px solid var(--line-soft);text-align:left;min-height:52px;}
  .cat-row:active{background:var(--sunken);}
  .cat-row-label{flex:1;font-size:17px;font-weight:600;color:var(--ink);}
  .cat-row-meta{font-size:14px;color:var(--steel);}
  .cat-row svg{width:18px;height:18px;color:var(--mist);flex-shrink:0;}
  .loc-block{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 14px;background:var(--sunken);border-radius:10px;}
  .loc-label{font-size:11px;font-weight:800;color:var(--steel);letter-spacing:0.06em;text-transform:uppercase;}
  .loc-value{font-size:21px;font-weight:800;color:var(--ink);line-height:1.15;}
  .loc-area{font-size:13px;color:var(--steel);margin-left:auto;}
  .pm-progress{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;}
  .pm-size{text-align:center;font-size:16px;font-weight:700;color:var(--steel);margin-bottom:18px;}
  .pm-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:6px;}
  .pm-stat{background:var(--sunken);border-radius:12px;padding:14px 6px;text-align:center;}
  .pm-stat-label{font-size:11.5px;font-weight:800;color:var(--steel);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
  .pm-stat-value{font-size:19px;font-weight:800;color:var(--ink);line-height:1.2;}
  .order-timeline{margin:6px 0 4px;}
  .ot-step{display:flex;align-items:center;gap:12px;padding:7px 0;position:relative;}
  .ot-step:not(:last-child)::after{content:'';position:absolute;left:11px;top:31px;bottom:-7px;width:2px;background:var(--line);}
  .ot-step.done:not(:last-child)::after{background:var(--good);}
  .ot-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid var(--line);color:var(--mist);flex-shrink:0;z-index:1;}
  .ot-dot svg{width:13px;height:13px;}
  .ot-step.done .ot-dot{background:var(--good);border-color:var(--good);color:#fff;}
  .ot-step.current .ot-dot{background:var(--ant-blue);border-color:var(--ant-blue);}
  .ot-label{font-size:15px;font-weight:600;color:var(--mist);}
  .ot-step.done .ot-label{color:var(--good);font-weight:700;}
  .ot-step.current .ot-label{color:var(--ant-blue);font-weight:800;}

  /* ---------- Large Text mode (Profile > Preferences) ---------- */
  #root.text-large{ font-size:18px; }
  #root.text-large .h1{ font-size:31px; }
  #root.text-large .h2{ font-size:23px; }
  #root.text-large .prodcard .pname{ font-size:19px; }
  #root.text-large .prodcard .pspec{ font-size:18px; }
  #root.text-large .cart-item .ciname, #root.text-large .check-item .ciname{ font-size:18px; }
  #root.text-large .cart-item .cimeta, #root.text-large .check-item .ciqty{ font-size:15px; }
  #root.text-large .btn{ font-size:18px; min-height:56px; }
  #root.text-large .field label{ font-size:15px; }
  #root.text-large .field input, #root.text-large .field textarea, #root.text-large .field select{ font-size:17px; }
  #root.text-large .ot-label{ font-size:17px; }
  #root.text-large .loc-value{ font-size:24px; }
  #root.text-large .pm-stat-value{ font-size:22px; }
  #root.text-large .pm-stat-label{ font-size:12.5px; }
  #root.text-large .qty-stepper-sm input{ font-size:18px; }
  #root.text-large .qty-stepper input{ font-size:21px; }
  #root.text-large .badge, #root.text-large .status-pill{ font-size:13.5px; }
  #root.text-large .tiny{ font-size:13.5px; }
  #root.text-large .small{ font-size:15.5px; }
  #root.text-large .navitem span{ font-size:12.5px; }

  .gridlist{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);padding:0 var(--space-5);}

  /* ---------- product detail / modal ---------- */
  .modal-overlay{
    position:absolute;inset:0;background:rgba(23,23,23,.45);z-index:50;
    display:flex;align-items:flex-end;
  }
  .modal-overlay.center{align-items:center;justify-content:center;padding:20px;}
  .sheet{
    width:100%;max-height:90%;background:var(--paper);border-radius:var(--radius-l) var(--radius-l) 0 0;
    overflow-y:auto;padding-bottom:var(--space-6);
    animation:sheet-up .18s ease-out;
  }
  @keyframes sheet-up{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .sheet{animation:none;} }
  .modal-overlay.center .sheet{border-radius:var(--radius-card);max-height:85%;animation:none;}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px;}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:6px var(--space-5) 10px;}
  .sheet-header .stitle{font-size:18px;font-weight:700;color:var(--ink);}

  .detail-photo{height:190px;background:var(--sunken);display:flex;align-items:center;justify-content:center;margin:0 var(--space-5) var(--space-4);border-radius:var(--radius-card);border:1px solid var(--line);}
  .detail-photo span{font-size:36px;font-weight:800;color:var(--mist);}
  .detail-photo svg{width:54px;height:54px;color:var(--mist);}
  .spec-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px;gap:14px;}
  .spec-row .k{color:var(--steel);flex-shrink:0;}
  .spec-row .v{font-weight:600;text-align:right;color:var(--ink);}
  .spec-block-title{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:0.01em;margin:22px 0 4px;}

  .qty-stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:var(--radius-m);overflow:hidden;}
  .qty-stepper button{width:48px;height:52px;background:var(--sunken);border:none;font-size:19px;font-weight:700;color:var(--ink);}
  .qty-stepper button:active{background:var(--line);}
  .qty-stepper input{width:68px;height:52px;border:none;text-align:center;font-size:19px;font-weight:700;color:var(--ink);border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);background:var(--panel);}
  .qty-stepper input:focus{outline:none;background:var(--ant-blue-tint);}

  /* compact quantity stepper used inside list rows (cart / kit / create-kit) —
     still meets the 44px minimum touch target on every button. */
  .qty-stepper-sm{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .qty-stepper-sm button{width:40px;height:40px;background:var(--sunken);border:none;font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .qty-stepper-sm button:active{background:var(--line);}
  .qty-stepper-sm button svg{width:16px;height:16px;}
  .qty-stepper-sm input{width:52px;height:40px;border:none;text-align:center;font-size:16px;font-weight:700;color:var(--ink);border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);background:var(--panel);}
  .qty-stepper-sm input:focus{outline:none;background:var(--ant-blue-tint);}

  /* ---------- cart / editable material rows (shared by cart, kit detail, create-kit) ---------- */
  .cart-item{display:flex;gap:12px;padding:16px var(--space-5);border-bottom:1px solid var(--line-soft);align-items:center;}

// Swaps a failed <img> for the standard ANT placeholder — used for network
// failures, timeouts, 404s, and hotlink blocks alike, so a broken photo
// never surfaces; the fallback is indistinguishable from "no photo yet".
function handleThumbImgError(el, initials){
  if(el && el.parentElement){ el.parentElement.innerHTML = '<span>'+initials+'</span>'; }
}
// Small thumb (product cards, cart/kit rows, checklist rows, inventory rows).
function thumbInner(p){
  const img = productImage(p);
  const initials = catInitials(p.cat);
  if(img) return '<img src="'+esc(img.url)+'" alt="'+esc(img.alt)+'" loading="lazy" style="width:100%;height:100%;object-fit:contain;" onerror="handleThumbImgError(this,\''+esc(initials)+'\')">';
  return '<span>'+esc(initials)+'</span>';
}
// Large hero (Product Detail).
function detailPhotoInner(p){
  const img = productImage(p);
  const initials = catInitials(p.cat);
  if(img) return '<img src="'+esc(img.urlLarge||img.url)+'" alt="'+esc(img.alt)+'" loading="lazy" style="width:100%;height:100%;object-fit:contain;padding:16px;" onerror="handleThumbImgError(this,\''+esc(initials)+'\')">';

}

   and for several materials (wire color, device finish, etc.) the brand is

const BRAND_ALTS = {
  wc:['Southwire','Encore Wire','Cerrowire'],
  cn:['Allied Tube & Conduit','Wheatland Tube','Republic Conduit'],
  cf:['Bridgeport Fittings','Thomas & Betts','Arlington Industries'],
  bx:['Steel City','RACO','Thepitt'],
  sp:['Unistrut','Cooper B-Line','Caddy'],
  pd:['Square D','Eaton','Siemens'],

  lv:['CommScope','Belden','Superior Essex'],
  fa:['ITW Tapcon','Simpson Strong-Tie','Hillman'],
  ee:['Square D','Eaton','ABB'],
};
function brandCode(name){ return name.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase(); }
function altPartNumber(basePart, brandName){
  const segs = basePart.split('-');
  if(segs.length>1){ segs[0] = brandCode(brandName); return segs.join('-'); }
  return brandCode(brandName)+'-'+basePart;
}
function buildBrands(p){
  const alts = BRAND_ALTS[p.cat] || [];
  const list = [{mfr:p.mfr, part:p.part}];
  alts.forEach(function(name){
    if(name!==p.mfr && list.length<3){ list.push({mfr:name, part:altPartNumber(p.part, name)}); }
  });
  list.push({mfr:'Not Applicable', part:null}); // legitimate value, not an error state — used when brand doesn't matter or isn't known
  return list;
}
PRODUCTS.forEach(function(p){ p.brands = buildBrands(p); });

function getProduct(id){
  const flat = PRODUCTS.find(p=>p.id===id);
  if(flat) return flat;
  return resolveFamilyVariant(id);
}
function productsByCategory(catKey){ return PRODUCTS.filter(p=>p.cat===catKey && !p.hidden); }
function brandOf(product, idx){ return (product.brands && product.brands[idx]) || {mfr:product.mfr, part:product.part}; }

/* =========================================================================
   PRODUCT FAMILIES — variant-based catalog layer.

   A Product Family represents ONE searchable/browsable card (e.g. "EMT
   Set-Screw Connector") that expands into a configuration screen where the
   user picks a value for each variantDimension that actually applies to it
   (only the dimensions defined below ever show — nothing irrelevant).

   The existing flat PRODUCTS array is NOT touched or deleted. Where a
   family below genuinely supersedes a flat product (e.g. the new EMT
   Conduit family supersedes the old cn1/cn2/cn3 single-size entries), the
   old entries are simply flagged `hidden:true` above so they stop showing
   up in search/browse — but they still resolve normally by id, so existing
   orders, inventory, and Job Kits that reference them are completely
   unaffected. This is the safe, no-data-loss way to consolidate.

   A configured family+variant selection becomes a synthetic id:
     "<familyId>::<value1>|<value2>|..."
   getProduct() resolves this the same way it resolves a flat id, so every
   existing system that already works off getProduct(id) — cart, order line
   items, Job Kits, Quick Reorder, Most Used/Recently Used, the warehouse

/* --- Family helpers --- */
function familyById(id){ return PRODUCT_FAMILIES.find(f=>f.id===id); }
function familyCategories(){ return PRODUCT_FAMILIES.filter(f=>!f.cat).map(f=>f.cat); }
function familiesByCategory(catKey){ return PRODUCT_FAMILIES.filter(f=>f.cat===catKey); }
// "pf-thhn::#12|Black|Stranded" — order matches family.variants order.
function familyVariantId(famId, selection){
  const fam = familyById(famId); if(!fam) return famId;
  const parts = fam.variants.map(v=>selection[v.key]||v.options[0]);
  return famId+'::'+parts.join('|');
}
function parseFamilyVariantId(id){
  const sep = id.indexOf('::');
  if(sep===-1) return null;
  const famId = id.slice(0,sep);
  const fam = familyById(famId);
  if(!fam) return null;
  const parts = id.slice(sep+2).split('|');
  const selection = {};
  fam.variants.forEach(function(v,i){ selection[v.key] = parts[i]; });
  return {fam:fam, selection:selection};
}
// Builds a size string like `3/4" · Insulated` from whichever variant values are present.
function variantSummary(fam, selection){
  return fam.variants.map(v=>selection[v.key]).filter(Boolean).join(' · ');
}
// Resolves a synthetic family+variant id into a product-shaped object so
// every existing part of ANT that calls getProduct(id) keeps working
// unmodified — cart rows, order line items, checklist, Packing Mode, etc.
function resolveFamilyVariant(id){
  const parsed = parseFamilyVariantId(id);
  if(!parsed) return null;
  const fam = parsed.fam, sel = parsed.selection;
  const brands = fam.brandOptions.map(function(name){ return {mfr:name, part:null}; });
  brands.push({mfr:'Not Applicable', part:null});
  return {
    id:id, cat:fam.cat, sub:fam.sub, name:fam.name,
    desc:fam.desc, mfr:brands[0].mfr, part:null,
    material:sel.material||'', size:variantSummary(fam, sel),
    application:fam.desc, unit:fam.unit, brands:brands,
    familyId:fam.id, variantSelection:sel, isFamilyVariant:true
  };
}

/* ---------------------------- PROJECT MEMBERSHIPS ----------------------------
   Authorization belongs to the USER + PROJECT relationship, never to the user
   alone. A ProjectMembership is the only thing that grants access to a
   project, and the only thing that decides what a person can do inside it. */
function mkMembership(projectId, userId, projectRole, permissionLevel, assignedBy){
  return {id:uid('mem'), projectId:projectId, userId:userId, projectRole:projectRole,
    permissionLevel:permissionLevel, assignedAt:now(), assignedBy:assignedBy, active:true};
}
// ProjectMembership is the authorization source of truth — this is the ONLY
// place a membership record is created, and it enforces one active record
// per (userId, projectId): if one already exists, it's updated in place
// rather than duplicated.
function addOrUpdateMembership(projectId, userId, projectRole, permissionLevel, assignedBy){
  const existing = MEMBERSHIPS.find(function(m){
    return m.projectId===projectId && m.userId===userId && m.active;
  });
  if(existing){
    existing.projectRole = projectRole;
    existing.permissionLevel = permissionLevel;
    existing.assignedAt = now();
    existing.assignedBy = assignedBy;
    return existing;
  }
  const m = mkMembership(projectId, userId, projectRole, permissionLevel, assignedBy);
  MEMBERSHIPS.push(m);
  return m;
}

/* ---------------------------- MOCK AUTHENTICATION ----------------------------
   PROTOTYPE ONLY. This verifies "is this the right person" (identity) —
   a completely different concern from the CENTRALIZED AUTHORIZATION section
   below, which verifies "is this person allowed to do X on project Y".

   A hardcoded 4-digit PIN compared in plain JavaScript is NOT production
   security — anyone with the browser console can read it. This function
   exists so that swapping in real authentication (a login server, OAuth,
   SSO, etc.) later means replacing ONLY this one function. Nothing in
   ProjectMembership/authorization, or anywhere else in ANT, needs to
   change: they only ever consume the resulting `user` object, never the
   PIN itself. */
function mockAuthenticatePin(user, enteredPin){
  return !!user && enteredPin===user.pin;
}

/* ---------------------------- CENTRALIZED AUTHORIZATION ----------------------------
   Every permission check in the app goes through these functions rather than
   being re-implemented per screen. UI visibility (hiding/disabling a button)
   is a courtesy, not the actual security boundary — every state-changing
   Action below re-checks these same functions before doing anything. */
function isForemanOf(user, projectId){ const m=membershipFor(user.id, projectId); return !!m && m.projectRole==='Foreman'; }
function canViewProject(user, projectId){ return !!membershipFor(user.id, projectId); }
function canCreateMaterialRequest(user, projectId){
  const m = membershipFor(user.id, projectId);
  return !!m && (m.projectRole==='Foreman' || m.permissionLevel==='can_edit');
}
function canEditMaterialRequest(user, projectId){ return canCreateMaterialRequest(user, projectId); }
function canSubmitMaterialRequest(user, projectId){ return canCreateMaterialRequest(user, projectId); }
function canManageProjectTeam(user, projectId){ return isForemanOf(user, projectId); }

   One company, one warehouse for this prototype (see companyId on PROJECTS/
   users) — structured so a future version could key this by warehouseId
   under a company without reshaping the model. */
let INVENTORY = {}; // productId -> {qty, location}
(function seedInventory(){
  const LOCATIONS = ['Shelf A-1','Shelf A-2','Shelf B-1','Shelf B-2','Shelf B-3','Shelf B-4','Shelf C-1','Shelf C-2',
    'Wire Rack 1','Wire Rack 2','Wire Rack 3','Conduit Rack 1','Conduit Rack 2','Bin D-1','Bin D-2'];
  // Deliberately understocked, for the low-stock/restock demo — chosen from
  // categories the seed ORDERS below don't touch, so the normal pack-to-100%
  // flow always has enough on hand and shortages only show up when a test
  // (or a real shortage scenario) specifically calls for one.
  const LOW_STOCK_IDS = ['cf7','sp2','pd6','lt5','lv2','fa3','ee5','bx5'];
  PRODUCTS.forEach(function(p, idx){
    const seed = (idx+7)*13.37;
    let qty;
    if(LOW_STOCK_IDS.indexOf(p.id)!==-1){
      const lowBase = p.unit==='FT' ? 60 : (p.unit==='BOX'||p.unit==='ROLL') ? 1 : 6;
      qty = Math.max(0, Math.round(lowBase * (0.3 + seededRandom(seed)*0.8)));
    } else {
      const base = p.unit==='FT' ? 1400 : (p.unit==='BOX'||p.unit==='ROLL') ? 10 : 100;
      qty = Math.round(base * (0.8 + seededRandom(seed)*1.6));
    }
    INVENTORY[p.id] = {qty:qty, location: LOCATIONS[idx % LOCATIONS.length]};
  });
})();
function lowStockThreshold(unit){
  if(unit==='FT') return 150;
  if(unit==='BOX' || unit==='ROLL') return 3;
  return 15; // EA, SET, PAIR
}
// New Product Family variants have no real per-SKU inventory tracking yet
// (that's future-backend work) — they get a generous placeholder stock
// level so the Warehouse flows stay usable end-to-end, clearly the same
// kind of mock data as the rest of ANT's seed inventory, not a claim of
// real stock. Legacy flat products are completely unaffected.
function isFamilyVariantId(productId){ return typeof productId==='string' && productId.indexOf('::')!==-1; }
// Called before any INVENTORY[productId].qty write. Legacy products already
// have a real entry and are returned unchanged; a family variant gets a
// real entry created on first touch, seeded at the same placeholder level
// availableQty() already reports, so reads and writes never disagree.
function ensureInventoryEntry(productId){
  if(!INVENTORY[productId] && isFamilyVariantId(productId)){
    INVENTORY[productId] = {qty:2500, location:'Main Warehouse'};
  }
  return INVENTORY[productId];
}
function availableQty(productId){
  if(INVENTORY[productId]) return INVENTORY[productId].qty;
  if(isFamilyVariantId(productId)) return 2500;
  return 0;
}
function inventoryLocation(productId){
  if(INVENTORY[productId]) return INVENTORY[productId].location;
  if(isFamilyVariantId(productId)) return 'Main Warehouse';
  return '—';
}
// Splits "Shelf B-4" -> {area:'Shelf', code:'B-4'}, "Wire Rack 2" -> {area:'Wire Rack', code:'2'}.
// The code is what should be large/prominent; the area is useful context, secondary.
function splitLocation(productId){
  const loc = inventoryLocation(productId);
  if(!loc || loc==='—') return {area:'', code:'—'};
  const parts = loc.split(' ');
  const code = parts.pop();
  return {area: parts.join(' '), code: code};
}
function locationBlock(productId){
  const loc = splitLocation(productId);
  return ''+
  '<div class="loc-block">'+
    '<div><div class="loc-label">Location</div><div class="loc-value">'+esc(loc.code)+'</div></div>'+
    (loc.area ? '<div class="loc-area">'+esc(loc.area)+'</div>' : '')+
  '</div>';
}
function isLowStock(productId){
  const p = getProduct(productId); if(!p) return false;
  return availableQty(productId) <= lowStockThreshold(p.unit);
}
function lowStockProducts(){ return PRODUCTS.filter(function(p){ return isLowStock(p.id); }); }
function shortageLines(){
  // every not-yet-resolved short line across all open orders — this is what
  // the Warehouse Manager needs to source/restock
  const out = [];
  ORDERS.forEach(function(o){
    o.items.forEach(function(it){
      if((it.shortQty||0) > 0){ out.push({order:o, item:it}); }
    });
  });
  return out;
}

/* =========================================================================
   PERSISTENCE — lightweight localStorage layer for this prototype.

   This is explicitly PROTOTYPE persistence, not a real database. A real
   backend would replace saveAppData()/loadAppData() with actual API calls;
   nothing else in ANT would need to change, since every screen reads and
   writes the same in-memory FOREMEN/MANAGERS/PROJECTS/MEMBERSHIPS/ORDERS/
   INVENTORY/JOB_KITS bindings regardless of where their data came from.

   Demo seed data (defined above, in the const/let declarations) is used
   only when no saved data exists yet — it is never silently overwritten.
   ========================================================================= */
const ANT_STORAGE_KEY = 'ant_prototype_data_v1';

function saveAppData(){
  try{
    const snapshot = {
      version: 1,
      foremen: FOREMEN, managers: MANAGERS, projects: PROJECTS,
      memberships: MEMBERSHIPS, orders: ORDERS, inventory: INVENTORY,
      jobKits: JOB_KITS, orderSeq: ORDER_SEQ,
      prefs: { language: S.language, textSize: S.textSize }
    };
    localStorage.setItem(ANT_STORAGE_KEY, JSON.stringify(snapshot));
  }catch(e){
    // localStorage unavailable (private browsing, quota, disabled) —
    // the prototype simply continues in-memory-only for this session.
  }
}

// Returns true if previously-saved data was found and restored.
function loadAppData(){
  let raw;
  try{ raw = localStorage.getItem(ANT_STORAGE_KEY); }catch(e){ return false; }
  if(!raw) return false;
  try{
    const data = JSON.parse(raw);
    if(!data || typeof data!=='object') return false;
    if(Array.isArray(data.foremen)) FOREMEN = data.foremen;
    if(Array.isArray(data.managers)) MANAGERS = data.managers;
    if(Array.isArray(data.projects)) PROJECTS = data.projects;
    if(Array.isArray(data.memberships)) MEMBERSHIPS = data.memberships;
    if(Array.isArray(data.orders)) ORDERS = data.orders;
    if(data.inventory && typeof data.inventory==='object') INVENTORY = data.inventory;
    if(Array.isArray(data.jobKits)) JOB_KITS = data.jobKits;
    if(typeof data.orderSeq==='number') ORDER_SEQ = data.orderSeq;
    if(data.prefs){
      if(data.prefs.language) S.language = data.prefs.language;
      if(data.prefs.textSize) S.textSize = data.prefs.textSize;
    }
    return true;
  }catch(e){ return false; }
}

  const shorted = order.items.filter(function(i){return (i.shortQty||0)>0;}).length;
  const done = collected + shorted;

}
function recomputeStatus(order){
  const p = orderProgress(order);
  if(['Ready to Ship','Shipped','Completed'].indexOf(order.status)!==-1) return; // manual stages, don't auto-downgrade
  if(p.done===0){ order.status='Pending'; }
  else if(p.done>0 && p.done<p.total){ order.status='Partially Packed'; }
  else if(p.total>0 && p.done===p.total){ order.status='Packed'; if(!order.packedAt) order.packedAt=now(); }
}

  switch(status){

    case 'Packed': return 2;
    case 'Ready to Ship': return 2;
    case 'Shipped': return 3;
    case 'Completed': return 4;

    }).join('')+

}

/* ---------------------------- FORMATTERS ---------------------------- */
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
}
function fmtNeeded(ts){
  const d = new Date(ts);
  const today = new Date(); today.setHours(0,0,0,0);
  const tmr = new Date(today); tmr.setDate(tmr.getDate()+1);
  const target = new Date(d); target.setHours(0,0,0,0);
  let dayLabel;
  if(target.getTime()===today.getTime()) dayLabel='Today';
  else if(target.getTime()===tmr.getTime()) dayLabel='Tomorrow';
  else dayLabel = d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
  return dayLabel+' · '+fmtTime(ts);
}
function relTime(ts){
  const diff = Math.max(0, Date.now()-ts);
  const min = Math.floor(diff/60000);
  if(min<1) return 'Just now';
  if(min<60) return min+' min ago';
  const hr = Math.floor(min/60);
  if(hr<24) return hr+' hour'+(hr===1?'':'s')+' ago';
  const day = Math.floor(hr/24);
  return day+' day'+(day===1?'':'s')+' ago';
}
function money(n){ return '$'+n.toLocaleString(undefined,{maximumFractionDigits:0}); }

function addToCart(productId, qty, brandIdx){
  brandIdx = brandIdx||0;
  const existing = S.cart.find(function(c){return c.productId===productId && c.brandIdx===brandIdx;});
  if(existing){ existing.qty += qty; } else { S.cart.push({productId:productId, qty:qty, brandIdx:brandIdx}); }
}
function updateCartQty(productId, brandIdx, qty){
  const it = S.cart.find(function(c){return c.productId===productId && c.brandIdx===brandIdx;});
  if(it){ it.qty = Math.max(1, qty|0 || 1); }
}
function removeFromCart(productId, brandIdx){ S.cart = S.cart.filter(function(c){return !(c.productId===productId && c.brandIdx===brandIdx);}); }
// Used by Job Kits: merges into ANY existing cart line for that product (regardless
// of brand) so kits never create accidental duplicate lines, and falls back to the
// foreman's saved brand preference (see brandPrefs) for materials not yet in the cart.
function addKitItemToCart(productId, qty){
  const existing = S.cart.find(function(c){return c.productId===productId;});
  if(existing){ existing.qty += qty; return; }
  const u = S.currentUser;
  const brandIdx = (u && u.brandPrefs && u.brandPrefs[productId]!=null) ? u.brandPrefs[productId] : 0;
  S.cart.push({productId:productId, qty:qty, brandIdx:brandIdx});
}

/* ---------------------------- ESCAPE HELPER ---------------------------- */
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* =========================================================================
   RENDER: ROOT
   ========================================================================= */
function render(){
  saveAppData();
  const root = document.getElementById('root');
  let html = '';
  switch(S.screen){
    case 'roleSelect': html = screenRoleSelect(); break;
    case 'foremanPicker': html = screenProfilePicker('foreman'); break;
    case 'managerPicker': html = screenProfilePicker('manager'); break;
    case 'pin': html = screenPin(); break;
    case 'newProfileRole': html = screenNewProfileRole(); break;
    case 'newProfile': html = screenNewProfile(); break;
    case 'fHome': html = screenForemanHome(); break;
    case 'fMyOrders': html = screenForemanOrders(); break;
    case 'fProjects': html = screenForemanProjects(); break;
    case 'fProfile': html = screenForemanProfile(); break;
    case 'fCart': html = screenCart(); break;
    case 'fOrderForm': html = screenOrderForm(); break;
    case 'fJobKits': html = screenJobKits(); break;
    case 'fCategory': html = screenCategory(); break;
    case 'whPackingMode': html = screenPackingMode(); break;
    case 'fCreateKit': html = screenCreateKit(); break;
    case 'fAddProject': html = screenAddProject(); break;
    case 'fProjectWorkspace': html = screenProjectWorkspace(); break;
    case 'mOrders': html = screenManagerOrders(); break;
    case 'mHome': html = screenWarehouseManagerHome(); break;
    case 'whHome': html = screenWarehouseWorkerHome(); break;
    case 'whPacking': html = screenWarehousePacking(); break;
    case 'mInventory': html = screenInventory(); break;
    case 'mSuppliers': html = screenManagerSuppliers(); break;
    case 'mHistory': html = screenManagerHistory(); break;
    case 'mProfile': html = screenManagerProfile(); break;
    default: html = screenRoleSelect();
  }
  // overlays
  if(S.modalProduct) html += renderProductModal();
  if(S.modalFamily) html += renderFamilyConfigureModal();
  if(S.modalKit) html += renderKitDetailModal();
  if(S.saveKitOrderId) html += renderSaveKitModal();
  if(S.reviewOpen) html += renderReviewModal();
  if(S.openOrderId && ['mOrders','mHistory','mHome','whHome','whPacking','mInventory'].indexOf(S.screen)!==-1) html += renderOrderDetailModal();
  if(S.supplierOrderId) html += renderSupplierModal();
  if(S.switcherOpen) html += renderProjectSwitcherModal();
  if(S.changeProjectWarning) html += renderChangeProjectWarningModal();
  if(S.duplicateWarning) html += renderDuplicateProjectModal();
  if(S.addTeamMemberOpen) html += renderAddTeamMemberModal();
  if(S.permissionChangeConfirm) html += renderPermissionChangeModal();
  if(S.deliveryConfirmOrderId) html += renderDeliveryConfirmModal();
  if(S.toast) html += '<div class="toast">'+ic('check')+'<span>'+esc(S.toast)+'</span></div>';

  root.innerHTML = html;
  afterRender();
}

/* =========================================================================
   PRODUCT FAMILY — CONFIGURE MODAL
   Mirrors the Product Detail modal's layout, but with one chip-row per
   variant dimension instead of a single fixed size — only dimensions
   defined on this specific family ever appear.
   ========================================================================= */
function renderFamilyConfigureModal(){
  const fam = familyById(S.modalFamily);
  if(!fam) return '';
  const sel = S.modalFamilySelection;
  const variantBlocks = fam.variants.map(function(v){
    return ''+
    '<div class="spec-block-title">'+esc(v.label)+'</div>'+
    '<div class="chiprow" style="padding:6px 0 10px;">'+
      v.options.map(function(opt){
        return '<button class="chip'+(sel[v.key]===opt?' on':'')+'" onclick="Actions.selectFamilyVariant(\''+v.key+'\',\''+esc(opt).replace(/'/g,"\\'")+'\')">'+esc(opt)+'</button>';
      }).join('')+
    '</div>';
  }).join('');
  const brandBlock = (fam.brandOptions && fam.brandOptions.length>0) ? (''+
    '<div class="spec-block-title">Preferred brand</div>'+
    '<div class="chiprow" style="padding:6px 0 10px;">'+
      fam.brandOptions.concat(['Not Applicable']).map(function(name, idx){
        return '<button class="chip'+(S.modalFamilyBrand===idx?' on':'')+'" onclick="Actions.selectFamilyBrand('+idx+')">'+esc(name)+'</button>';
      }).join('')+
    '</div>'
  ) : '';
  const unitBlock = (fam.altUnits && fam.altUnits.length>0) ? (''+
    '<div class="spec-block-title">Unit</div>'+
    '<div class="chiprow" style="padding:6px 0 10px;">'+
      [fam.unit].concat(fam.altUnits).map(function(u){
        return '<button class="chip'+((sel.__unit||fam.unit)===u?' on':'')+'" onclick="Actions.selectFamilyUnit(\''+u+'\')">'+esc(u)+'</button>';
      }).join('')+
    '</div>'
  ) : '';
  const chosenUnit = sel.__unit || fam.unit;
  const complete = fam.variants.every(function(v){ return !!sel[v.key]; });
  return ''+
  '<div class="modal-overlay" onclick="if(event.target===this) Actions.closeFamily()">'+
    '<div class="sheet">'+
      '<div class="sheet-handle"></div>'+
      '<div class="sheet-header"><div class="stitle">'+esc(catLabel(fam.cat))+'</div><button class="icon-btn" onclick="Actions.closeFamily()">'+ic('close')+'</button></div>'+
      '<div class="detail-photo">'+detailPhotoInner(fam)+'</div>'+
      '<div class="section-pad">'+
        '<div class="h1">'+esc(fam.name)+'</div>'+
        '<div class="small muted" style="margin-bottom:14px;">'+esc(fam.desc)+'</div>'+
        variantBlocks+
        brandBlock+

// the person has already ordered before (so a brand default already exists),

function searchProducts(q){
  const s = q.trim().toLowerCase();
  if(!s) return [];
  const flatHits = PRODUCTS.filter(function(p){
    if(p.hidden) return false;
    return (p.name+' '+p.desc+' '+catLabel(p.cat)+' '+(p.sub||'')+' '+p.mfr+' '+p.part+' '+p.size+' '+(p.aliases||[]).join(' ')).toLowerCase().indexOf(s)!==-1;
  });
  const familyHits = PRODUCT_FAMILIES.filter(function(fam){
    const haystack = (fam.name+' '+fam.desc+' '+catLabel(fam.cat)+' '+(fam.sub||'')+' '+(fam.aliases||[]).join(' ')).toLowerCase();
    if(haystack.indexOf(s)!==-1) return true;
    // also match if every word in the query appears somewhere in name/aliases/variant option values
    const words = s.split(/\s+/).filter(Boolean);
    if(words.length<2) return false;
    const optionWords = fam.variants.reduce(function(acc,v){ return acc.concat(v.options.map(o=>o.toLowerCase())); }, []).join(' ');
    const fullText = haystack+' '+optionWords;
    return words.every(function(w){ return fullText.indexOf(w)!==-1; });
  });
  return flatHits.concat(familyHits);
}
// For a family found via search, tries to pre-select a variant value per
// dimension based on words in the query (e.g. "3/4 emt connector" -> size
// "3/4""; "12 black thhn" -> gauge "#12", color "Black"). Falls back to no
// preselection (the person just taps through the chips) if nothing matches.
function guessFamilyVariants(fam, query){
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  const sel = {};
  fam.variants.forEach(function(v){
    for(const opt of v.options){
      const optNorm = opt.toLowerCase().replace(/["']/g,'').replace(/^#/,'');
      if(words.some(function(w){ return w.replace(/["']/g,'').replace(/^#/,'')===optNorm; })){
        sel[v.key] = opt;
        break;
      }
    }
  });
  return sel;
}

function combineDateTime(dateStr,timeStr){
  if(!dateStr) return null;
  const t = timeStr || '09:00';
  const dt = new Date(dateStr+'T'+t+':00');
  return isNaN(dt.getTime()) ? null : dt.getTime();
}

function findSimilarProject(name, address, number){
  const n = (name||'').trim().toLowerCase();
  const a = (address||'').trim().toLowerCase();
  const num = (number||'').trim().toLowerCase();
  return PROJECTS.find(function(p){

/* =========================================================================

function materialStateFromStatus(status){
  if(['Pending','In Progress','Partially Packed'].indexOf(status)!==-1) return 'Requested';
  if(['Packed','Ready to Ship'].indexOf(status)!==-1) return 'Being Prepared';
  if(status==='Shipped') return 'On the Way';
  if(status==='Completed') return 'Delivered';
  return status;
}
function foremanNameForProject(projectId){
  const f = teamForProject(projectId).find(function(x){ return x.membership.projectRole==='Foreman'; });
  return f ? f.user.name : 'Unassigned';
}
function statTile(value, label){
  return '<div class="info-card" style="text-align:center;padding:14px 6px;"><div style="font-size:21px;font-weight:800;color:var(--ink);">'+value+'</div><div class="tiny muted" style="margin-top:2px;">'+label+'</div></div>';
}

function renderProjectMaterialsTab(proj, u){
  const orders = ORDERS.filter(function(o){ return o.project===proj.name; });
  const canReq = canCreateMaterialRequest(u, proj.id);
  const buckets = {'Requested':[], 'Being Prepared':[], 'On the Way':[], 'Delivered':[]};
  orders.forEach(function(o){ buckets[materialStateFromStatus(o.status)].push(o); });
  let html = '<div class="section-pad">';
  html += canReq
    ? '<button class="btn btn-primary" style="margin-bottom:18px;" onclick="Actions.startRequestFromWorkspace(\''+proj.id+'\')">'+ic('plus')+' Request materials</button>'
    : '<div class="alert-banner" style="background:var(--sunken);color:var(--ink-soft);">'+ic('projects')+'<span>You have view-only access to material requests on this project.</span></div>';
  let any = false;
  ['Requested','Being Prepared','On the Way','Delivered'].forEach(function(bucket){
    const list = buckets[bucket];
    if(!list.length) return;
    any = true;
    html += '<div class="h2" style="margin:18px 0 10px;">'+bucket+'</div>';
    list.forEach(function(o){
      html += ''+
      '<div class="info-card" style="margin-bottom:10px;">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;"><div style="font-weight:700;">'+esc(o.id)+'</div><span class="badge badge-'+o.priority+'">'+o.priority+'</span></div>'+
        '<div class="tiny muted" style="margin-top:4px;">'+o.items.length+' material'+(o.items.length===1?'':'s')+' · Requested by '+esc(o.foremanName)+'</div>'+
      '</div>';
    });
  });
  if(!any) html += '<div class="empty"><div class="etitle">No materials requested yet</div></div>';
  html += '</div>';
  return html;
}

function renderProjectDeliveriesTab(proj){
  const u = S.currentUser;
  const canConfirm = canCreateMaterialRequest(u, proj.id);
  const shipped = ORDERS.filter(function(o){ return o.project===proj.name && o.status==='Shipped'; }).sort(function(a,b){return b.createdAt-a.createdAt;});
  const delivered = ORDERS.filter(function(o){ return o.project===proj.name && o.status==='Completed'; }).sort(function(a,b){return (b.completedAt||0)-(a.completedAt||0);});
  const needsConfirm = delivered.filter(function(o){ return !o.fieldConfirmed; });
  function row(o){
    const when = o.status==='Completed' ? (o.completedAt ? 'Delivered '+relTime(o.completedAt) : 'Delivered') : 'Expected '+fmtNeeded(o.neededBy);
    let confirmLine = '';
    if(o.status==='Completed'){
      if(o.fieldConfirmed && o.deliveryIssues && o.deliveryIssues.length){
        confirmLine = '<div class="tiny" style="color:var(--warning);font-weight:700;margin-top:4px;">'+ic('alert')+' Delivery issue reported</div>';
      } else if(o.fieldConfirmed){
        confirmLine = '<div class="tiny" style="color:var(--good);font-weight:700;margin-top:4px;">'+ic('check')+' Confirmed by '+esc(o.fieldConfirmedBy||'field')+'</div>';
      }
    }
    return ''+
    '<div class="info-card" style="margin-bottom:10px;">'+
      '<div style="font-weight:700;">'+o.items.length+' material'+(o.items.length===1?'':'s')+'</div>'+
      '<div class="tiny muted" style="margin-top:2px;">'+esc(when)+' · '+esc(o.id)+'</div>'+
      confirmLine+
    '</div>';
  }
  let html = '<div class="section-pad">';
  if(canConfirm && needsConfirm.length){
    html += '<div class="h2" style="margin-bottom:10px;">Needs confirmation</div>';
    needsConfirm.forEach(function(o){
      html += ''+
      '<div class="info-card" style="margin-bottom:10px;border-color:var(--ant-blue);">'+
        '<div style="font-weight:700;">'+o.items.length+' material'+(o.items.length===1?'':'s')+' delivered</div>'+
        '<div class="tiny muted" style="margin-top:2px;">'+esc(o.id)+'</div>'+
        '<button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px;" onclick="Actions.openDeliveryConfirm(\''+o.id+'\')">'+t('did_everything_arrive')+'</button>'+
      '</div>';
    });
    html += '<div class="divider"></div>';
  }
  html += ''+
    '<div class="h2" style="margin-bottom:10px;">On the way</div>'+
    (shipped.length ? shipped.map(row).join('') : '<div class="empty" style="padding:20px 0;"><div class="etitle">Nothing on the way</div></div>')+
    '<div class="divider"></div>'+
    '<div class="h2" style="margin-bottom:10px;">Delivered</div>'+
    (delivered.length ? delivered.map(row).join('') : '<div class="empty" style="padding:20px 0;"><div class="etitle">No deliveries yet</div></div>')+
  '</div>';
  return html;
}

/* =========================================================================
   PACKING MODE — one material at a time. The full checklist (renderOrderDetailModal)
   still exists and is one tap away via "View full list"; this is the default,
   simplified path for a Warehouse Worker.
   ========================================================================= */
function firstUnresolvedIndex(o){
  for(let i=0;i<o.items.length;i++){
    const it = o.items[i];
    if(!it.collected && !(it.shortQty>0)) return i;
  }
  return -1; // everything resolved
}
function screenPackingMode(){
  const o = ORDERS.find(function(x){return x.id===S.packingOrderId;});
  if(!o) return screenWarehouseWorkerHome();
  const items = o.items;
  const doneCount = items.filter(function(x){ return x.collected || (x.shortQty||0)>0; }).length;

  if(doneCount>=items.length){
    return ''+
    '<div class="content no-nav" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px;text-align:center;">'+
      '<div class="checkbox on" style="width:56px;height:56px;border-radius:50%;margin-bottom:18px;">'+ic('check')+'</div>'+
      '<div class="h1">'+t('packing_complete')+'</div>'+
      '<div class="muted" style="margin-bottom:26px;">'+esc(o.id)+' · '+items.length+' of '+items.length+' materials packed</div>'+
      '<button class="btn btn-primary" style="max-width:280px;" onclick="Actions.exitPackingMode()">'+t('done')+'</button>'+
    '</div>';
  }

  let idx = S.packingIndex;
  if(idx>=items.length || items[idx].collected || (items[idx].shortQty||0)>0){
    idx = firstUnresolvedIndex(o);
    S.packingIndex = idx;
  }
  const it = items[idx];
  const p = getProduct(it.productId);
  const avail = availableQty(it.productId);
  const enough = avail >= it.qty;
  const loc = splitLocation(it.productId);
  const pct = Math.round((doneCount/items.length)*100);

  return ''+
  '<div class="app-header">'+
    '<button class="icon-btn" onclick="Actions.exitPackingMode()">'+ic('close')+'</button>'+
    '<div><div class="htitle" style="font-size:18px;">'+esc(o.id)+'</div><div class="hsub">'+esc(o.project)+' · Needed '+fmtNeeded(o.neededBy)+'</div></div>'+
  '</div>'+
  '<div class="content no-nav">'+
    '<div class="section-pad">'+
      '<div class="pm-progress"><span>'+t('packing')+'</span><span>'+(doneCount+1)+' of '+items.length+'</span></div>'+
      '<div class="progress-bar" style="margin-bottom:24px;"><div class="progress-fill'+(pct===100?' complete':'')+'" style="width:'+pct+'%;"></div></div>'+
      '<div class="detail-photo" style="height:210px;margin-left:0;margin-right:0;">'+detailPhotoInner(p)+'</div>'+
      '<div class="h1" style="text-align:center;margin-top:16px;margin-bottom:2px;">'+esc(p.name)+'</div>'+
      (p.size ? '<div class="pm-size">'+esc(p.size)+'</div>' : '')+
      '<div class="pm-stats">'+
        '<div class="pm-stat"><div class="pm-stat-label">'+t('need')+'</div><div class="pm-stat-value">'+it.qty+' '+esc(p.unit)+'</div></div>'+
        '<div class="pm-stat"><div class="pm-stat-label">'+t('location')+'</div><div class="pm-stat-value">'+esc(loc.code)+'</div></div>'+
        '<div class="pm-stat"><div class="pm-stat-label">'+t('available')+'</div><div class="pm-stat-value" style="color:'+(enough?'var(--good)':'var(--warning)')+';">'+avail+' '+esc(p.unit)+'</div></div>'+
      '</div>'+
      (enough
        ? '<button class="btn btn-primary" style="margin-top:22px;" onclick="Actions.packCurrentFull()">'+ic('check')+' '+t('pack')+' '+it.qty+' '+esc(p.unit)+'</button>'
        : (''+
          '<div class="alert-banner" style="background:var(--warning-bg);color:var(--warning);margin-top:22px;">'+ic('alert')+'<span>Only '+avail+' '+esc(p.unit)+' available — not enough to pack '+it.qty+'.</span></div>'+
          '<button class="btn btn-secondary" onclick="Actions.packCurrentShort()">'+t('mark_short')+'</button>'
        ))+
      '<div style="display:flex;justify-content:center;gap:18px;margin-top:16px;">'+
        '<button class="btn-ghost" onclick="Actions.packingSkip()">'+t('skip_for_now')+'</button>'+
        '<button class="btn-ghost" onclick="Actions.viewFullListFromPacking()">'+t('view_full_list')+'</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

    if(canEdit){
      const shortages = shortageLines();
      const lowStock = lowStockProducts();
      html += '<div class="h2" style="margin-bottom:10px;">Restock</div>';
      if(shortages.length){
        html += shortages.map(function(s){
          const p = getProduct(s.item.productId);
          if(!p) return '';
          return '<div class="info-card" style="margin-bottom:10px;"><div style="font-weight:700;">'+esc(p.name)+'</div><div class="tiny muted" style="margin-top:2px;"><b style="color:var(--warning);">Short '+s.item.shortQty+' '+esc(p.unit)+'</b> · '+esc(s.order.id)+' ('+esc(s.order.project)+')</div></div>';
        }).join('');
      }
      if(lowStock.length){
        html += '<div class="h2" style="margin:18px 0 10px;">Low stock</div>'+
          lowStock.map(function(p){ return inventoryRow(p, true); }).join('');
      }
      if(!shortages.length && !lowStock.length){
        html += '<div class="empty" style="padding:20px 0;"><div class="etitle">Nothing needs restocking</div></div>';
      }
      html += '<button class="btn btn-secondary" style="margin-top:12px;" onclick="Actions.goto(\'mSuppliers\')">'+ic('store')+' Browse suppliers</button>';
    } else {
      html += '<div class="tiny muted">Search above to find where a material is and how much is available.</div>';
    }
  } else {
    html += '<div class="h2" style="margin-bottom:10px;">'+list.length+' result'+(list.length===1?'':'s')+'</div>';
    html += list.length ? list.map(function(p){ return inventoryRow(p, canEdit); }).join('') : '<div class="empty"><div class="etitle">No inventory items found</div><div>Try another name, size, or part number.</div></div>';
  }
  html += '</div>';
  return html;
}

function screenManagerOrders(){
  const statusOptions = ['All','New','In Progress','Packed','Ready to Ship','Completed'];
  const priorityOptions = ['All','Emergency','High','Normal','Low'];

  let list = ORDERS.filter(function(o){
    const op = projectByName(o.project);
    if(!op || op.companyId!==S.currentUser.companyId) return false;
    if(S.mStatusFilter!=='All'){
      if(S.mStatusFilter==='New' && o.status!=='Pending') return false;
      if(S.mStatusFilter==='In Progress' && ['In Progress','Partially Packed'].indexOf(o.status)===-1) return false;
      if(S.mStatusFilter==='Packed' && o.status!=='Packed') return false;
      if(S.mStatusFilter==='Ready to Ship' && o.status!=='Ready to Ship') return false;
      if(S.mStatusFilter==='Completed' && ['Completed','Shipped'].indexOf(o.status)===-1) return false;
    }
    if(S.mPriorityFilter!=='All' && o.priority!==S.mPriorityFilter) return false;
    return true;
  }).sort(function(a,b){
    const pr = PRIORITY_RANK[b.priority]-PRIORITY_RANK[a.priority];
    if(pr!==0) return pr;
    return b.createdAt-a.createdAt;
  });

  return ''+
  '<div class="app-header"><div><div class="brand-tag">ANT</div><div class="htitle">Orders</div><div class="hsub">'+list.length+' order'+(list.length===1?'':'s')+' shown</div></div></div>'+

      return '<button class="chip'+(S.mStatusFilter===s?' on':'')+'" onclick="Actions.setStatusFilter(\''+s+'\')">'+s+'</button>';
    }).join('') +'</div>'+
    '<div class="tab-row" style="margin-top:8px;margin-bottom:6px;">'+ priorityOptions.map(function(s){
      return '<button class="chip'+(S.mPriorityFilter===s?' on':'')+'" onclick="Actions.setPriorityFilter(\''+s+'\')">'+s+'</button>';
    }).join('') +'</div>'+
    '<div style="height:12px;"></div>'+
    (list.length? list.map(managerOrderCard).join('') : '<div class="empty">'+ic('orders')+'<div class="etitle">No orders match these filters</div><div>Try a different status or priority.</div>'+

/* =========================================================================
   SUPPLIER COMPARISON
   ========================================================================= */
function seededRandom(seed){
  let x = Math.sin(seed)*10000; return x-Math.floor(x);
}
function renderSupplierModal(){
  const o = ORDERS.find(function(x){return x.id===S.supplierOrderId;});
  if(!o) return '';
  const total = o.items.length;
  const cards = SUPPLIERS.map(function(s, idx){
    const seed = (o.id.charCodeAt(o.id.length-1)+1) * (idx+3) * 7.13;
    const availPct = 0.75 + seededRandom(seed)*0.25;
    const avail = Math.max(1, Math.round(total*availPct));
    const basePrice = 18 + seededRandom(seed+1)*14;
    const estTotal = Math.round(o.items.reduce(function(sum,it){return sum+it.qty;},0) * basePrice / 8);
    return ''+
    '<div class="supplier-card">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'+
        '<div><div style="font-weight:800;font-size:15px;">'+esc(s.name)+'</div><div class="tiny muted">'+s.distance+' miles · '+esc(s.address)+'</div></div>'+
        ic('store')+
      '</div>'+
      '<div class="srow"><span>Estimated availability</span><b>'+avail+' / '+total+' items</b></div>'+
      '<div class="srow"><span>Estimated total</span><b>'+money(estTotal)+'</b></div>'+
      '<div class="srow"><span>Phone</span><b>'+esc(s.phone)+'</b></div>'+
    '</div>';
  }).join('');
  return ''+
  '<div class="modal-overlay" onclick="if(event.target===this) Actions.closeSuppliers()">'+
    '<div class="sheet">'+
      '<div class="sheet-handle"></div>'+
      '<div class="sheet-header"><div class="stitle">Suppliers for '+esc(o.id)+'</div><button class="icon-btn" onclick="Actions.closeSuppliers()">'+ic('close')+'</button></div>'+
      '<div class="section-pad" style="padding-top:0;padding-bottom:0;"><div class="tiny muted">Estimates are illustrative — connect a live supplier feed to replace these with real quotes.</div></div>'+
      '<div style="height:14px;"></div>'+
      cards+
      '<div style="height:8px;"></div>'+
    '</div>'+
  '</div>';
}

const Actions = {
  confirmResetDemoData:function(){
    if(confirm('Reset all saved demo data? This clears everything stored on this device and restores the original demo projects, orders, and inventory.')){
      resetDemoData();
    }
  },
  chooseRole:function(role){
    S.role = role;
    setState({screen: role==='foreman' ? 'foremanPicker' : 'managerPicker'});
  },
  back:function(){
    if(S.screen==='foremanPicker'||S.screen==='managerPicker'){ setState({screen:'roleSelect', role:null}); return; }
    if(S.screen==='pin'){ setState({screen: S.role==='foreman'?'foremanPicker':'managerPicker', pinValue:'', pinError:false}); return; }
    if(S.screen==='newProfileRole'){ setState({screen: S.role==='foreman'?'foremanPicker':'managerPicker', errorBanner:null}); return; }
    if(S.screen==='newProfile'){ setState({screen:'newProfileRole', errorBanner:null}); return; }
    setState({screen:'roleSelect'});
  },
  goto:function(screen){ setState({screen:screen, errorBanner:null}); },
  pickProfile:function(role, id){
    const p = (role==='foreman'? FOREMEN: MANAGERS).find(function(x){return x.id===id;});
    setState({pendingProfile:p, screen:'pin', pinValue:'', pinError:false});
  },
  pinDigit:function(d){
    if(S.pinValue.length>=4) return;
    const val = S.pinValue + d;
    S.pinError = false;
    if(val.length===4){
      if(mockAuthenticatePin(S.pendingProfile, val)){
        const p = S.pendingProfile;
        if(S.role==='foreman'){
          setState({pinValue:val, currentUser:p, currentProject:p.currentProject||null, screen:'fHome', fNav:'home'});
        }else{
          const home = p.baseRole==='warehouse_worker' ? 'whHome' : 'mHome';
          setState({pinValue:val, currentUser:p, screen:home, mNav:'home'});
        }
      } else {
        setState({pinValue:val, pinError:true});
        setTimeout(function(){ setState({pinValue:'', pinError:false}); }, 650);
      }
    } else {
      setState({pinValue:val});
    }
  },
  pinBackspace:function(){ setState({pinValue:S.pinValue.slice(0,-1), pinError:false}); },
  startOnboarding:function(workArea){
    S.newProfile = {workArea:workArea, role:'', name:'', email:'', phone:'', pin:'', company:'Ali Electric'};
    setState({screen:'newProfileRole', errorBanner:null});
  },
  selectOnboardingRole:function(role){
    S.newProfile.role = role;
    setState({screen:'newProfile', errorBanner:null});
  },
  submitNewProfile:function(){
    const name = document.getElementById('np-name').value.trim();
    const emailRaw = document.getElementById('np-email').value.trim();
    const phoneRaw = document.getElementById('np-phone').value.trim();
    const pin = document.getElementById('np-pin').value.trim();
    const company = document.getElementById('np-company').value.trim();

    if(!name){ setState({errorBanner:t('err_name_required')}); return; }
    if(!emailRaw || !isValidEmail(emailRaw)){ setState({errorBanner:t('err_email_invalid')}); return; }
    if(!phoneRaw || !isValidPhone(phoneRaw)){ setState({errorBanner:t('err_phone_invalid')}); return; }
    if(!/^[0-9]{4}$/.test(pin)){ setState({errorBanner:t('err_pin_invalid')}); return; }
    if(!company){ setState({errorBanner:t('err_company_required')}); return; }
    const email = normalizeEmail(emailRaw);
    if(emailTaken(email)){ setState({errorBanner:t('err_email_taken')}); return; }
    if(phoneTaken(phoneRaw)){ setState({errorBanner:t('err_phone_taken')}); return; }

    const np = S.newProfile;
    let created, homeScreen;
    if(np.workArea==='field'){
      created = {id:uid('f'), name:name, email:email, phone:phoneRaw, pin:pin, companyRole:np.role, baseRole:np.role.toLowerCase(),
        companyId:'company1', currentProject:null, mostUsed:[], recentlyUsed:[], brandPrefs:{}};
      FOREMEN.push(created);
      homeScreen = 'fHome';
    } else {
      const baseRole = np.role==='Warehouse Manager' ? 'warehouse_manager' : 'warehouse_worker';
      created = {id:uid('m'), name:name, email:email, phone:phoneRaw, pin:pin, title:np.role, baseRole:baseRole, companyId:'company1'};
      MANAGERS.push(created);
      homeScreen = baseRole==='warehouse_worker' ? 'whHome' : 'mHome';
    }
    setState({currentUser:created, currentProject:created.currentProject||null, screen:homeScreen, fNav:'home', mNav:'home',
      newProfile:{workArea:'', role:'', name:'',email:'',phone:'',pin:'',company:'Ali Electric'}, errorBanner:null});
    showToast('Welcome to ANT, '+name.split(' ')[0]+'.');
  },
  fNavTo:function(nav, screen){ setState({fNav:nav, screen:screen}); },
  mNavTo:function(nav, screen){ setState({mNav:nav, screen:screen}); },
  logout:function(){
    setState({screen:'roleSelect', role:null, currentUser:null, currentProject:null, cart:[],
      searchQuery:'', pendingProfile:null, openOrderId:null, supplierOrderId:null});

  reviewOrder:function(){

    const dateEl = document.getElementById('needed-date');
    const timeEl = document.getElementById('needed-time');
    const notesEl = document.getElementById('order-notes');
    S.orderDraft.neededDate = dateEl.value;
    S.orderDraft.neededTime = timeEl.value || '09:00';
    S.orderDraft.notes = notesEl.value;
    if(S.cart.length===0){ setState({errorBanner:t('err_cart_empty')}); return; }
    if(!S.orderDraft.neededDate){ setState({errorBanner:t('err_needed_date')}); return; }

    setState({errorBanner:null, reviewOpen:true});

  sendOrder:function(){
    if(S.sending) return;
    if(!S.currentProject){ setState({errorBanner:t('err_no_project')}); return; }
    if(!canRequestNow()){
      setState({errorBanner:t('no_permission_submit')});
      return;
    }
    if(S.cart.length===0){ setState({errorBanner:t('err_cart_empty')}); return; }
    if(!S.orderDraft.neededDate){ setState({errorBanner:t('err_needed_date')}); return; }
    if(!S.orderDraft.priority){ setState({errorBanner:t('err_priority')}); return; }
    const foreman = S.currentUser;
    const project = S.currentProject;
    const draft = {neededDate:S.orderDraft.neededDate, neededTime:S.orderDraft.neededTime, priority:S.orderDraft.priority, notes:S.orderDraft.notes};
    const cartSnapshot = S.cart.map(function(c){ return {productId:c.productId, qty:c.qty, brandIdx:c.brandIdx||0}; });
    S.sending = true;
    render();
    setTimeout(function(){
      const neededTs = combineDateTime(draft.neededDate, draft.neededTime);
      const order = {
        id: nextOrderId(), foremanId:foreman.id, foremanName:foreman.name, phone:foreman.phone,
        project:project, priority:draft.priority, neededBy:neededTs, notes:draft.notes,
        status:'Pending', createdAt:now(), packedAt:null, shippedAt:null, completedAt:null,
        fieldConfirmed:false, fieldConfirmedBy:null, fieldConfirmedAt:null, deliveryIssues:null,
        items: cartSnapshot.map(function(c){ return {productId:c.productId, qty:c.qty, brandIdx:c.brandIdx, collected:false}; })
      };
      ORDERS.unshift(order);
      // update foreman usage memory (on the captured foreman, not whoever is logged in now)
      order.items.forEach(function(it){
        foreman.recentlyUsed = [it.productId].concat(foreman.recentlyUsed.filter(function(x){return x!==it.productId;})).slice(0,10);
        if(foreman.mostUsed.indexOf(it.productId)===-1) foreman.mostUsed.push(it.productId);
      });
      S.sending = false;
      // only force the UI back to fHome if this is still the same foreman's active session
      if(S.currentUser===foreman){
        S.cart = [];
        S.orderDraft = {neededDate:'', neededTime:'07:00', priority:'Normal', notes:''};
        setState({reviewOpen:false, screen:'fHome', fNav:'home'});
        showToast('Material request sent. The warehouse can now see it.');
      } else {
        render();
      }
    }, 450);
  },

  toggleItemCollected:function(orderId, productId, brandIdx){
    if(!canPickMaterials(S.currentUser)) return;
    const o = ORDERS.find(function(x){return x.id===orderId;});
    if(!o) return;
    const it = o.items.find(function(i){return i.productId===productId && (i.brandIdx||0)===(brandIdx||0);});
    if(!it || (it.shortQty||0)>0) return; // resolved-short lines aren't toggled back through the checkbox
    const p = getProduct(productId);
    if(!it.collected){
      // picking: only allow a full pick if the warehouse actually has enough
      if(availableQty(productId) < it.qty) return; // UI should offer Mark Short instead
      ensureInventoryEntry(productId);
      INVENTORY[productId].qty -= it.qty;
      it.collected = true;
    } else {
      // undo a pick: give the stock back
      ensureInventoryEntry(productId);
      INVENTORY[productId].qty += it.qty;
      it.collected = false;
    }
    if(o.status==='Pending') o.status='In Progress';
    recomputeStatus(o);
    logActivity(projectIdForOrder(o), S.currentUser.name+' '+(it.collected?'collected':'un-collected')+' '+it.qty+' '+p.unit+' of '+p.name+' on '+o.id+'.');
    render();
  },
  markItemShort:function(orderId, productId, brandIdx){
    if(!canPickMaterials(S.currentUser)) return;
    const o = ORDERS.find(function(x){return x.id===orderId;});
    if(!o) return;
    const it = o.items.find(function(i){return i.productId===productId && (i.brandIdx||0)===(brandIdx||0);});
    if(!it || it.collected || (it.shortQty||0)>0) return;
    const p = getProduct(productId);
    const avail = availableQty(productId);
    const packQty = Math.min(avail, it.qty);
    ensureInventoryEntry(productId);
    INVENTORY[productId].qty -= packQty;
    it.packedQty = packQty;
    it.shortQty = it.qty - packQty;
    if(o.status==='Pending') o.status='In Progress';
    recomputeStatus(o);
    logActivity(projectIdForOrder(o), S.currentUser.name+' marked '+it.shortQty+' '+p.unit+' of '+p.name+' short on '+o.id+' ('+packQty+' packed).');
    render();
  },

  packingSkip:function(){
    const o = ORDERS.find(function(x){return x.id===S.packingOrderId;});
    if(!o) return;
    let next = -1;
    for(let i=S.packingIndex+1;i<o.items.length;i++){
      if(!o.items[i].collected && !(o.items[i].shortQty>0)){ next=i; break; }
    }
    if(next===-1){
      for(let i=0;i<S.packingIndex;i++){
        if(!o.items[i].collected && !(o.items[i].shortQty>0)){ next=i; break; }
      }
    }
    if(next!==-1) S.packingIndex = next;
    render();
  },
  markReadyToShip:function(orderId){
    if(!canDispatchOrder(S.currentUser)) return;
    const o = ORDERS.find(function(x){return x.id===orderId;});
    if(!o) return;
    if(o.status!=='Packed'){ showToast('This order must be fully packed before it can be marked ready to ship.'); return; }
    o.status='Ready to Ship'; logActivity(projectIdForOrder(o), S.currentUser.name+' marked '+o.id+' ready to ship.');
    render();
  },
  markShipped:function(orderId){
    if(!canDispatchOrder(S.currentUser)) return;
    const o = ORDERS.find(function(x){return x.id===orderId;});
    if(!o) return;
    if(o.status!=='Ready to Ship'){ showToast('This order must be marked ready to ship first.'); return; }
    o.status='Shipped'; o.shippedAt=now(); logActivity(projectIdForOrder(o), S.currentUser.name+' marked '+o.id+' shipped.');
    render();
  },
  markCompleted:function(orderId){
    if(!canDispatchOrder(S.currentUser)) return;
    const o = ORDERS.find(function(x){return x.id===orderId;});
    if(!o) return;
    if(o.status!=='Shipped'){ showToast('This order must be shipped before it can be marked delivered.'); return; }
    o.status='Completed'; o.completedAt=now(); logActivity(projectIdForOrder(o), S.currentUser.name+' marked '+o.id+' delivered.');
    setState({openOrderId:null});
    showToast('Order marked complete');
  },
  openDeliveryConfirm:function(orderId){
    const o = ORDERS.find(function(x){return x.id===orderId;});
    if(!o) return;
    const proj = projectByName(o.project);
    if(!proj || !canCreateMaterialRequest(S.currentUser, proj.id)) return;
    const draft = {};
    o.items.forEach(function(it){ draft[it.productId] = it.qty; }); // default: assume everything arrived
    setState({deliveryConfirmOrderId:orderId, deliveryConfirmStep:'ask', deliveryArrivedQty:draft});
  },
  closeDeliveryConfirm:function(){ setState({deliveryConfirmOrderId:null, deliveryConfirmStep:'ask', deliveryArrivedQty:{}}); },
  goToReportMissing:function(){ setState({deliveryConfirmStep:'report'}); },
  setArrivedQty:function(productId, val){ S.deliveryArrivedQty[productId] = Math.max(0, val); render(); },
  setArrivedQtyInput:function(productId, val){
    S.deliveryArrivedQty[productId] = Math.max(0, parseInt(val,10)||0);
    const o = ORDERS.find(function(x){ return x.id===S.deliveryConfirmOrderId; });
    const it = o && o.items.find(function(i){ return i.productId===productId; });
    const p = getProduct(productId);
    const span = document.getElementById('missing-'+productId);
    if(span && it && p){
      const arrived = S.deliveryArrivedQty[productId];
      span.textContent = arrived<it.qty ? 'Missing: '+(it.qty-arrived)+' '+p.unit : '';
      span.style.color = arrived<it.qty ? 'var(--warning)' : '';
      span.style.fontWeight = arrived<it.qty ? '700' : '';
      span.style.marginTop = arrived<it.qty ? '8px' : '0';
    }
  },
  confirmDeliveryComplete:function(){
    const o = ORDERS.find(function(x){return x.id===S.deliveryConfirmOrderId;});
    if(!o) return;
    o.fieldConfirmed = true;
    o.fieldConfirmedBy = S.currentUser.name;
    o.fieldConfirmedAt = now();
    o.deliveryIssues = null;
    logActivity(projectIdForOrder(o), S.currentUser.name+' confirmed '+o.id+' arrived complete.');
    setState({deliveryConfirmOrderId:null, deliveryConfirmStep:'ask', deliveryArrivedQty:{}});
    showToast('Delivery confirmed. Thanks!');
  },
  submitDeliveryReport:function(){
    const o = ORDERS.find(function(x){return x.id===S.deliveryConfirmOrderId;});
    if(!o) return;
    const issues = [];
    o.items.forEach(function(it){
      const arrived = S.deliveryArrivedQty[it.productId];
      const missing = it.qty - (arrived==null ? it.qty : arrived);
      if(missing>0){
        const p = getProduct(it.productId);
        issues.push({productId:it.productId, name:p?p.name:it.productId, unit:p?p.unit:'', expected:it.qty, arrived:arrived, missing:missing});
      }
    });
    o.fieldConfirmed = true;
    o.fieldConfirmedBy = S.currentUser.name;
    o.fieldConfirmedAt = now();
    o.deliveryIssues = issues;
    const pid = projectIdForOrder(o);
    if(issues.length){
      const summary = issues.map(function(i){ return i.missing+' × '+i.name; }).join(', ');
      logActivity(pid, S.currentUser.name+' reported delivery issue on '+o.id+': '+summary+' missing.');
    } else {
      logActivity(pid, S.currentUser.name+' confirmed '+o.id+' arrived complete.');
    }
    setState({deliveryConfirmOrderId:null, deliveryConfirmStep:'ask', deliveryArrivedQty:{}});
    showToast(issues.length ? 'Delivery issue recorded.' : 'Delivery confirmed. Thanks!');
  },
  findSuppliers:function(orderId){
    if(!canSourceMaterials(S.currentUser)) return;
    setState({supplierOrderId:orderId});
  },
  closeSuppliers:function(){ setState({supplierOrderId:null}); },
};
window.Actions = Actions;

/* ---------------------------- POST-RENDER HOOKS ---------------------------- */
function afterRender(){
  // default the needed-date field to today if empty, once the order form mounts
  const dateEl = document.getElementById('needed-date');
  if(dateEl && !dateEl.value){
    const t = new Date(); const iso = t.toISOString().slice(0,10);
    dateEl.value = S.orderDraft.neededDate || iso;
  }
}

/* ---------------------------- INIT ---------------------------- */
loadAppData();
render();
</script>
</body>
</html>
